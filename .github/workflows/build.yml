name: Build

on: pull_request

jobs:
  build-matrix:
    strategy:
      matrix:
        node-version:
          - 20.x
        os:
          # windows-2022 pinned: the node-gyp bundled with npm on Node 20
          # fails to locate Visual Studio on newer windows images
          # (ERR_CHILD_PROCESS_STDIO_MAXBUFFER in "find VS").
          - windows-2022
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install dependencies
      if: ${{ startsWith(matrix.os, 'ubuntu') }}
      run: sudo apt install -y unixodbc-dev
    - name: Install dependencies
      if: ${{ startsWith(matrix.os, 'macos') }}
      run: brew install unixodbc
    - name: Upgrade NPM
      run: npm install -g npm
    - name: Build package
      run: npm ci --production --build-from-source
